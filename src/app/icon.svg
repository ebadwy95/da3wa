  <path d="M32 10 L37 27 L54 32 L37 37 L32 54 L27 37 L10 32 L27 27 Z"
        fill="none" stroke="#d9b877" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M32 22 L34.2 29.8 L42 32 L34.2 34.2 L32 42 L29.8 34.2 L22 32 L29.8 29.8 Z"
        fill="#e0c48d" opacity="0.9"/>
</svg>
