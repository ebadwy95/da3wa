<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:wght@300;400&family=Amiri:wght@400&family=Rubik:wght@300;400;500&display=swap">
<style>
  /* Deliberately no CSS animations anywhere in this scene.
     Every frame is drawn by calling render(t) with an explicit time, so the
     renderer can seek to an exact moment and get a byte-identical result.
     CSS animation would tie the output to wall-clock timing and make the
     encode jitter — the same reason a screenshot mid-transition came out
     blank earlier in this project. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #0b0906;
  }

  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    background:
      radial-gradient(ellipse 90% 55% at 50% 42%, #2a2114 0%, #14100a 55%, #0b0906 100%);
    font-family: "Rubik", sans-serif;
    color: #f4ede0;
    overflow: hidden;
  }

  /* Slow drifting motes. Gold dust rather than snow — sparse, uneven, and
     never crossing the centre where the names sit. */
  .mote {
    position: absolute;
    border-radius: 50%;
    background: #e0c48d;
    will-change: transform, opacity;
  }

  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 75% 60% at 50% 45%, transparent 40%, rgba(4,3,2,0.75) 100%);
  }

  .layer {
    position: absolute;
    inset-inline: 0;
    text-align: center;
    will-change: transform, opacity;
  }

  #bismillah {
    top: 545px;
    font-family: "Aref Ruqaa", serif;
    /* Aref Ruqaa runs small for its point size — at 46px this line read as an
       afterthought next to the names rather than as the opening of the card. */
    font-size: 62px;
    line-height: 1.85;
    color: #d9b877;
  }

  /* The names live in an SVG, not in a div.
     Two reasons. The reveal has to follow the shape of the letters — Eslam
     was right that a pen sliding along the top of the line is not writing —
     and that means an SVG mask with a brush stroke traced through the ink,
     which a CSS gradient cannot express. And the HTML version showed a faint
     rectangle around the names: a masked element with will-change and a
     screen-blended glow beside it each get their own compositing layer, and
     the seams between them printed as a box. Inside one SVG there are no
     seams to print. */
  #namesSvg {
    position: absolute;
    left: 0;
    top: 760px;
  }
  #nameText {
    font-family: "Aref Ruqaa", serif;
    font-weight: 700;
    font-size: 132px;
    fill: #fdf6e6;
    /* drop-shadow, not a blurred box behind: this one follows the glyphs. */
    filter: drop-shadow(0 0 40px rgba(224, 196, 141, 0.3));
  }
  #nameShine {
    font-family: "Aref Ruqaa", serif;
    font-weight: 700;
    font-size: 132px;
  }

  #date {
    top: 1108px;
    /* Cormorant Garamond, not Rubik: Rubik is the app's interface face and it
       made the date read like a field value under a calligraphic name. A light
       old-style serif at this tracking reads as engraving. Amiri backs it up
       for an Arabic date, which Cormorant cannot set. */
    font-family: "Cormorant Garamond", "Amiri", serif;
    font-size: 52px;
    font-weight: 300;
    letter-spacing: 0.3em;
    padding-inline-start: 0.3em;
    /* Cormorant ships old-style figures by default, which drew 10 as IO — the
       one and the zero are drawn at x-height and read as letters. lnum asks
       for lining figures; tnum keeps them on an even rhythm at this tracking. */
    font-variant-numeric: lining-nums tabular-nums;
    font-feature-settings: "lnum" 1, "tnum" 1;
    color: #d2c3a6;
  }

  #venue {
    top: 1210px;
    font-size: 36px;
    font-weight: 300;
    color: #a1937e;
  }

  svg { overflow: visible; }
  #starTop { position: absolute; top: 300px; left: 50%; transform: translateX(-50%); }
  /* The wrapper is what's positioned; the svg inside stays in normal flow so
     the flex centring actually applies to it. Making the svg itself absolute
     took it out of the flex context and the rule never appeared. */
  #ruleWrap { position: absolute; top: 1030px; inset-inline: 0; display: flex; justify-content: center; }
</style>
</head>
<body>
<div id="stage">
  <div id="motes"></div>

  <!-- Eight-point star: the same geometry used across the product's cards,
       drawn stroke-first so it can be written on rather than faded in. -->
  <svg id="starTop" width="220" height="220" viewBox="0 0 100 100">
    <path id="starPath"
      d="M50 8 L59.5 40.5 L92 50 L59.5 59.5 L50 92 L40.5 59.5 L8 50 L40.5 40.5 Z"
      fill="none" stroke="#d9b877" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>

  <div class="layer" id="bismillah">بسم الله نبدأ فرحتنا</div>

  <svg id="namesSvg" width="1080" height="300" viewBox="0 0 1080 300">
    <defs>
      <!-- What has been written so far. The rect is everything the pen has
           already passed; the brush is the leading edge, and it is a stroke
           traced through the middle of the ink, so the letters come out along
           their own shape instead of from behind a vertical wipe. -->
      <mask id="writeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="300">
        <rect id="maskDone" x="1080" y="0" width="0" height="300" fill="#fff"/>
        <path id="maskBrush" fill="none" stroke="#fff" stroke-width="112"
              stroke-linecap="round" stroke-linejoin="round"
              pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      </mask>

      <!-- The pass of light is a fill on a copy of the text, so it can only
           ever appear on the letters. As a blurred rectangle over the top it
           showed its own edges. -->
      <linearGradient id="sweepGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="340" y2="0">
        <stop offset="0"   stop-color="#fff6de" stop-opacity="0"/>
        <stop offset="0.5" stop-color="#fffdf4" stop-opacity="1"/>
        <stop offset="1"   stop-color="#fff6de" stop-opacity="0"/>
      </linearGradient>

      <radialGradient id="haloGrad">
        <stop offset="0"    stop-color="#fff4d6" stop-opacity="0.9"/>
        <stop offset="0.34" stop-color="#e6cd97" stop-opacity="0.34"/>
        <stop offset="1"    stop-color="#e6cd97" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <g mask="url(#writeMask)">
      <text id="nameText"  x="540" y="180" text-anchor="middle"></text>
      <text id="nameShine" x="540" y="180" text-anchor="middle" fill="url(#sweepGrad)" opacity="0"></text>
    </g>

    <g id="sparks"></g>

    <g id="pen" opacity="0">
      <circle r="130" fill="url(#haloGrad)"/>
      <path id="penStar" d="M0 -27 7.5 -7.5 27 0 7.5 7.5 0 27 -7.5 7.5 -27 0 -7.5 -7.5Z" fill="#fff8e6"/>
    </g>
  </svg>

  <div id="ruleWrap">
    <svg width="620" height="24" viewBox="0 0 620 24">
      <line id="ruleL" x1="310" y1="12" x2="310" y2="12" stroke="#b08d57" stroke-width="1.4"/>
      <line id="ruleR" x1="310" y1="12" x2="310" y2="12" stroke="#b08d57" stroke-width="1.4"/>
      <path id="ruleDot" d="M310 4 L313 11 L320 12 L313 13 L310 20 L307 13 L300 12 L307 11 Z" fill="#d9b877"/>
    </svg>
  </div>

  <!-- dir=ltr, or the RTL stage reorders the groups and 22 . 10 . 2026 comes
       out as 2026 . 10 . 22. The dots are bidi-neutral, so the paragraph
       direction is the only thing deciding the order. -->
  <div class="layer" id="date" dir="ltr"></div>
  <div class="layer" id="venue"></div>

  <div id="vignette"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Timeline. Everything is a pure function of t (seconds), so render(t) can be
// called in any order and always produces the same frame.
// ---------------------------------------------------------------------------
const DURATION = 12.4;

// The window the name is written in. Named because four other cues hang off
// it — the pen, the sparks, the glow and the first sweep all have to agree
// about when the writing starts and stops.
const NAME_A = 2.2;
const NAME_B = 5.6;

const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
// Ease used for anything entering — fast start, long settle. Motion that
// decelerates reads as "placed" rather than "thrown".
const easeOut = (v) => 1 - Math.pow(1 - clamp01(v), 3);
const easeInOut = (v) => (v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2);
// Normalised progress of t through [start, end].
const span = (t, start, end) => clamp01((t - start) / (end - start));

const $ = (id) => document.getElementById(id);

// --- Motes: fixed pseudo-random field, seeded so every render matches ------
let seed = 7;
const rand = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

const MOTES = Array.from({ length: 46 }, () => ({
  x: rand() * 1080,
  y: rand() * 1920,
  r: 1.5 + rand() * 4.5,
  drift: 18 + rand() * 46,      // px travelled over the whole clip
  phase: rand() * Math.PI * 2,
  peak: 0.18 + rand() * 0.5,
}));

const motesEl = $("motes");
MOTES.forEach((m) => {
  const el = document.createElement("div");
  el.className = "mote";
  el.style.width = el.style.height = m.r * 2 + "px";
  el.style.left = m.x + "px";
  el.style.top = m.y + "px";
  motesEl.appendChild(el);
  m.el = el;
});

// --- The path the pen writes along -------------------------------------------
// The reveal follows the letters, which means knowing where the letters are.
// Chrome will not hand out glyph outlines, so the name is drawn once to an
// offscreen canvas at the same font and size and read back a column at a time:
// for every x, the top and bottom of the ink. The line through the middle of
// that is the path a hand would take across the word — up over an alif, down
// into the tail of a ya — and it is what both the brush and the star ride.
//
// Done once per setContent, never per frame: this is a full-frame getImageData
// and doing it 360 times would take minutes.

const NAME_W = 1080, NAME_H = 300, BASE_Y = 180;
const NAME_FONT = '700 132px "Aref Ruqaa", serif';
const STEP = 6;          // px between samples along the word
const SMOOTH = 5;        // samples either side, so the pen glides rather than jitters

let PATH = { pts: [], acc: [], total: 0, xMin: 0, xMax: NAME_W };

function traceInk(text) {
  const cv = document.createElement("canvas");
  cv.width = NAME_W;
  cv.height = NAME_H;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.font = NAME_FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.direction = "rtl";
  ctx.fillStyle = "#fff";
  ctx.fillText(text || "", NAME_W / 2, BASE_Y);

  const data = ctx.getImageData(0, 0, NAME_W, NAME_H).data;
  const mid = new Array(NAME_W).fill(null);
  let xMin = -1, xMax = -1;
  for (let x = 0; x < NAME_W; x++) {
    let top = -1, bot = -1;
    for (let y = 0; y < NAME_H; y++) {
      if (data[(y * NAME_W + x) * 4 + 3] > 40) { if (top < 0) top = y; bot = y; }
    }
    if (top >= 0) {
      mid[x] = (top + bot) / 2;
      if (xMin < 0) xMin = x;
      xMax = x;
    }
  }
  if (xMin < 0) { PATH = { pts: [], acc: [], total: 0, xMin: 0, xMax: NAME_W }; return; }

  // Right to left: Arabic is written that way, and so is this.
  const raw = [];
  let last = mid[xMax];
  for (let x = xMax; x >= xMin; x -= STEP) {
    // Spaces have no ink. Carrying the last height across them keeps the path
    // continuous instead of dropping to zero between two words.
    if (mid[x] != null) last = mid[x];
    raw.push({ x, y: last });
  }

  const pts = raw.map((_, i) => {
    let sy = 0, n = 0;
    for (let k = -SMOOTH; k <= SMOOTH; k++) {
      const j = i + k;
      if (j >= 0 && j < raw.length) { sy += raw[j].y; n++; }
    }
    return { x: raw[i].x, y: sy / n };
  });

  // Arc length, so the star sits exactly where the brush edge is. Sampling by
  // index instead would drift wherever the path climbs steeply.
  const acc = [0];
  for (let i = 1; i < pts.length; i++) {
    acc[i] = acc[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  }
  PATH = { pts, acc, total: acc[acc.length - 1] || 1, xMin, xMax };

  $("maskBrush").setAttribute(
    "d",
    pts.map((q, i) => `${i ? "L" : "M"}${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(" ")
  );
}

// A point a given fraction along the written path, measured by arc length.
function pointAt(u) {
  const { pts, acc, total } = PATH;
  if (!pts.length) return { x: NAME_W / 2, y: BASE_Y };
  const target = Math.max(0, Math.min(1, u)) * total;
  let i = 1;
  while (i < acc.length && acc[i] < target) i++;
  if (i >= acc.length) return pts[pts.length - 1];
  const span = acc[i] - acc[i - 1] || 1;
  const k = (target - acc[i - 1]) / span;
  return {
    x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * k,
    y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * k,
  };
}

// --- Sparks thrown off the nib as it writes ---------------------------------
// Seeded like the motes, and each one is a pure function of t: born at a fixed
// point along the write, from wherever the pen was at that moment.
const SPARKS = Array.from({ length: 20 }, () => ({
  born: 0.05 + rand() * 0.88,
  life: 0.45 + rand() * 0.85,
  vx: (rand() - 0.5) * 90,
  vy: -30 - rand() * 90,
  r: 1.8 + rand() * 3.6,
}));

const sparkEls = SPARKS.map((s) => {
  const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  el.setAttribute("r", s.r.toFixed(1));
  el.setAttribute("fill", "#fff3d4");
  el.setAttribute("opacity", "0");
  $("sparks").appendChild(el);
  return el;
});

const starLength = $("starPath").getTotalLength();
$("starPath").style.strokeDasharray = starLength;

let CONTENT = { names: "", date: "", venue: "" };

// async: the trace is worthless before the font it measures has loaded, and
// Playwright awaits the promise this returns.
async function setContent(c) {
  CONTENT = { ...CONTENT, ...c };
  $("nameText").textContent = CONTENT.names || "";
  $("nameShine").textContent = CONTENT.names || "";
  $("date").textContent = CONTENT.date || "";
  $("venue").textContent = CONTENT.venue || "";
  await document.fonts.ready;
  traceInk(CONTENT.names || "");
}

function render(t) {
  // --- 0.0–1.6s  the star writes itself ----------------------------------
  const star = easeOut(span(t, 0.15, 1.7));
  $("starPath").style.strokeDashoffset = starLength * (1 - star);
  $("starTop").style.opacity = clamp01(span(t, 0.1, 0.6));

  // --- 1.1–2.3s  the opening line ----------------------------------------
  const bis = easeOut(span(t, 1.1, 2.3));
  $("bismillah").style.opacity = bis;
  $("bismillah").style.transform = `translateY(${(1 - bis) * 26}px)`;

  // --- 2.2–5.6s  the names, written by a point of light ------------------
  // The shot the whole film exists for, so it is not allowed to just appear.
  // A star travels the word along the path traced through the ink — up over
  // the alif, down through the tail — and the letters come out from under it.
  //
  // easeInOut, not easeOut: a hand starts slowly, runs through the middle of a
  // word and slows at the end. A stroke that begins at full speed is a wipe.
  const write = easeInOut(span(t, NAME_A, NAME_B));
  const head = pointAt(write);

  // The brush is the leading edge; the rect is everything already written and
  // follows a little way behind, so there is always a stretch where the letter
  // is being drawn rather than already there.
  $("maskBrush").setAttribute("stroke-dashoffset", String(100 - write * 100));
  const lag = 46 * (1 - easeOut(span(t, NAME_B - 0.35, NAME_B)));
  const doneFrom = write <= 0 ? NAME_W : Math.max(0, head.x + lag);
  $("maskDone").setAttribute("x", doneFrom.toFixed(1));
  $("maskDone").setAttribute("width", Math.max(0, NAME_W - doneFrom).toFixed(1));

  // The pen: in before the first letter, out once the last one is down.
  const penOn =
    clamp01(span(t, NAME_A - 0.35, NAME_A + 0.15)) *
    (1 - clamp01(span(t, NAME_B - 0.15, NAME_B + 0.45)));
  $("pen").setAttribute("opacity", penOn.toFixed(3));
  $("pen").setAttribute("transform", `translate(${head.x.toFixed(1)} ${head.y.toFixed(1)})`);
  $("penStar").setAttribute(
    "transform",
    `rotate(${(write * 210).toFixed(1)}) scale(${(0.85 + Math.sin(write * Math.PI) * 0.35).toFixed(3)})`
  );

  SPARKS.forEach((s, i) => {
    const age = t - (NAME_A + s.born * (NAME_B - NAME_A));
    const el = sparkEls[i];
    if (age <= 0 || age >= s.life) { el.setAttribute("opacity", "0"); return; }
    const from = pointAt(easeInOut(s.born));
    const x = from.x + s.vx * age;
    const y = from.y + s.vy * age + 70 * age * age; // thrown up, then falling back
    el.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    el.setAttribute("opacity", (Math.pow(1 - age / s.life, 2) * 0.9).toFixed(3));
  });

  // The glow swells as the name completes and then eases back, so the light
  // looks like it is coming off the letters rather than sitting behind them.
  // Low while writing: the name should not be lit before it exists.
  const glowIn = easeOut(span(t, NAME_B - 1.2, NAME_B + 0.6));
  const glowOut = 1 - 0.45 * easeOut(span(t, 8.6, 10.6));
  $("nameText").style.filter =
    `drop-shadow(0 0 ${(20 + glowIn * 70 * glowOut).toFixed(1)}px rgba(224,196,141,${(0.12 + glowIn * 0.46 * glowOut).toFixed(3)}))`;

  // Once the pen is gone the name keeps breathing — a name that freezes the
  // instant it lands reads as a slide.
  const settled = write > 0.995;
  const breathe = settled ? Math.sin((t - NAME_B) * 0.85) * 0.005 : 0;
  const drift = settled ? Math.sin((t - NAME_B) * 0.6) * 3 : 0;
  $("namesSvg").style.transform = `scale(${1 + breathe}) translateY(${drift}px)`;

  // --- two passes of light, not one --------------------------------------
  // Painted as a fill on a copy of the text, so the light can only ever land
  // on the letters. The old version was a blurred rectangle laid over them,
  // and at full strength you could see its edges.
  const sweep = (a, b, peak) => {
    const k = span(t, a, b);
    if (k <= 0 || k >= 1) return null;
    return { o: peak * Math.sin(k * Math.PI), x: -340 + easeInOut(k) * (NAME_W + 340) };
  };
  const sh = sweep(5.9, 7.5, 0.85) || sweep(9.0, 11.0, 0.4);
  $("nameShine").setAttribute("opacity", sh ? sh.o.toFixed(3) : "0");
  if (sh) {
    $("sweepGrad").setAttribute("x1", sh.x.toFixed(1));
    $("sweepGrad").setAttribute("x2", (sh.x + 340).toFixed(1));
  }

  // --- 6.1–7.4s  the rule opens outward from its centre ornament ---------
  const rule = easeOut(span(t, 6.1, 7.4));
  $("ruleL").setAttribute("x2", String(310 - rule * 265));
  $("ruleR").setAttribute("x2", String(310 + rule * 265));
  $("ruleDot").style.opacity = clamp01(span(t, 6.0, 6.6));
  $("ruleL").style.opacity = rule;
  $("ruleR").style.opacity = rule;

  // --- 7.1–8.6s  date, then venue ----------------------------------------
  const dt = easeOut(span(t, 7.1, 8.6));
  $("date").style.opacity = dt;
  $("date").style.transform = `translateY(${(1 - dt) * 16}px)`;

  const vn = easeOut(span(t, 7.9, 9.4));
  $("venue").style.opacity = vn;
  $("venue").style.transform = `translateY(${(1 - vn) * 16}px)`;

  // --- motes drift the whole way through ---------------------------------
  const p = t / DURATION;
  MOTES.forEach((m) => {
    const y = -m.drift * p;
    const x = Math.sin(m.phase + p * Math.PI * 1.4) * 12;
    m.el.style.transform = `translate(${x}px, ${y}px)`;
    // Fade in over the first second, hold, then out over the last.
    const inOut = Math.min(clamp01(t / 1.0), clamp01((DURATION - t) / 1.2));
    m.el.style.opacity = m.peak * inOut;
  });

  // --- final half second dims everything so the loop point is soft -------
  const out = span(t, DURATION - 0.55, DURATION);
  $("stage").style.opacity = 1 - out * 0.85;
}

window.__scene = { render, setContent, DURATION };
render(0);
</script>
</body>
</html>
